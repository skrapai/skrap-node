name: Release

# Publishes to npm when a maintainer pushes a version tag (v0.1.0, ...).
# Tags cannot come from forks, so secrets never reach untrusted code.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm provenance and trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: Use an npm with trusted publishing support
        run: npm install -g npm@11
      - name: Tag matches package.json version
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "v${PKG_VERSION}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run check
      - run: npm run test:dist
      # With a trusted publisher configured on npmjs.com, OIDC is used and NPM_TOKEN can stay unset.
      # Otherwise set the NPM_TOKEN secret (an automation token) on the "npm" environment.
      - name: Publish
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
